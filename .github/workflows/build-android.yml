name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          rm -rf app
          mkdir app
          unzip -q rotina-no-controle-mobile-github.zip -d app

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        working-directory: app
        run: npm install

      - name: Criar projeto Android
        working-directory: app
        run: npx cap add android

      - name: Sincronizar aplicativo
        working-directory: app
        run: npx cap sync android

      - name: Preparar permissões
        working-directory: app
        run: npm run prepare:native

      - name: Gerar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Rotina-No-Controle-Android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
